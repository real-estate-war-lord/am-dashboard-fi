name: refresh-data
on:
  schedule: [{ cron: "0 6 3 * *" }]   # 3rd of each month, 06:00 UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      # Only the cheap, keyless sources are refreshed monthly. Geometry (Paavo, kuntajako) is
      # a pinned vintage and is refreshed by hand when a new one is published — see docs/GEO.md.
      - name: Check the config against live StatFin metadata
        run: python scripts/validate_config.py
      - name: Pull StatFin tables
        run: python scripts/fetch_statfin.py
      - name: Rebuild the processed data
        run: python scripts/build_makro.py
      - name: Commit processed data
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/processed data/raw
          git commit -m "data: monthly refresh $(date +%F)" || echo "nothing to commit"
          git push
