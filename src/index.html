<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Macro Dashboard — Finland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>{{LEAFLET_CSS}}</style>
<style>{{APP_CSS}}</style>
</head>
<body>
<div class="app">
  <button class="navtoggle" id="navtoggle" data-testid="nav-toggle" data-navtoggle aria-label="Menu" aria-expanded="false">☰</button>
  <div class="navscrim" data-navclose hidden></div>
  <aside data-testid="sidebar" id="sidebar">
    <div class="brand"><h2>Macro Dashboard</h2><span class="brandsub">Finland</span></div>
    <div id="nav"></div>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <main id="main">
    <div class="topbar"><div id="hd"></div><div id="hdact"></div></div>
    <div id="body"></div>
  </main>
</div>
<!-- W4: the one-line source footer. It lives outside .app so that present mode can pin it to the
     bottom of the window and print can put it at the end of the last page; app.js fills it on
     every render and CSS decides whether it is on screen. -->
<div class="srcfoot" id="srcfoot" data-testid="source-footer"></div>
<!-- W5 A11Y8: the one aria-live region. app.js writes a sentence into it when the map drills into a
     municipality ("Showing Helsinki, 84 postal codes"); it is never on screen and never printed. -->
<div class="srlive" id="srlive" role="status" aria-live="polite" aria-atomic="true" data-testid="live-region"></div>
<script>{{LEAFLET_JS}}</script>
<script>window.DATA = {{DATA}};</script>
<script>{{ROUTE_JS}}</script>
<script>{{PICKER_JS}}</script>
<script>{{RAMP_JS}}</script>
<script>{{SCALE_JS}}</script>
<script>{{GEOM_JS}}</script>
<script>{{W5_JS}}</script>
<script>{{W5UI_JS}}</script>
<script>{{CHARTSVG_JS}}</script>
<script>{{TESTPROP_JS}}</script>
<script>{{PRESENT_JS}}</script>
<script>{{APP_JS}}</script>
</body>
</html>
